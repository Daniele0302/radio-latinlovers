<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio — Radio LatinLovers</title>
  <meta name="description" content="Ascolta i sei canali di Radio LatinLovers in diretta e consulta gli ultimi brani trasmessi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e10f1b'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3ELL%3C/text%3E%3C/svg%3E" />
</head>
<body data-page="radio">

  <section class="page-head">
    <div class="container">
      <div class="crumb">Radio</div>
      <h1>In diretta</h1>
      <p>Sei canali di musica latina, attivi 24 ore su 24. Scegli un canale, premi play e lascia il resto alla musica.</p>
    </div>
  </section>

  <section class="section" id="canali" style="padding-top:34px">
    <div class="container">
      <div class="section-head"><h2>Canali</h2></div>
      <div class="ch-grid" id="channels"></div>
    </div>
  </section>

  <section class="section alt" id="ultimi">
    <div class="container">
      <div class="section-head"><h2>Ultimi brani · <span data-np-channel>Reggaeton</span></h2></div>
      <div class="onair-grid">
        <div class="np-big">
          <span class="lbl">In onda ora</span>
          <div class="np-title" data-np-title>Caricamento…</div>
          <div class="np-artist" data-np-artist></div>
          <button class="btn btn-red" data-play type="button">Ascolta in diretta</button>
        </div>
        <div class="tracklist" id="recent"></div>
      </div>
    </div>
  </section>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
